<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бюджет/система управления бюджетом</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('app-theme');
            const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', savedTheme || systemTheme);
            
            const savedAccent = localStorage.getItem('app-accent');
            if (savedAccent) {
                document.documentElement.style.setProperty('--accent', savedAccent);
                let r = parseInt(savedAccent.slice(1, 3), 16);
                let g = parseInt(savedAccent.slice(3, 5), 16);
                let b = parseInt(savedAccent.slice(5, 7), 16);
                document.documentElement.style.setProperty('--accent-rgb', `${r}, ${g}, ${b}`);
            }
        })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="hamburger" id="hamburger" aria-label="Меню">
        <span></span><span></span><span></span>
    </button>
    <div class="mobile-overlay" id="mobile-overlay"></div>

    <header>
        <h1>Бюджет/система управления бюджетом</h1>
        
        <nav class="theme-controls" aria-label="Настройки темы">
            <select id="theme-select" aria-label="Выбор темы">
                <option value="light">Светлая</option>
                <option value="dark">Темная</option>
                <option value="high-contrast">Контрастная</option>
            </select>
            <input type="color" id="accent-color" value="#06b6d4" aria-label="Выбор акцентного цвета">
        </nav>

        <section>
            <fieldset>
                <div>
                    <h2>Регистрация</h2>
                    <label for="reg-name">Имя</label>
                    <input type="text" id="reg-name" placeholder="Иван">
                </div>
                <div>
                    <label for="reg-contact">Почта/телефон</label>
                    <input type="text" id="reg-contact" placeholder="111@gmail.com">
                </div>
                <div>
                    <label for="reg-password">Пароль</label>
                    <input type="password" id="reg-password" placeholder="пароль?">
                </div>
                <button type="button" class="btn-primary">Зарегистрироваться</button>
            </fieldset>

            <fieldset>
                <div>
                    <h2>Вход</h2>
                    <label for="login-contact">Почта/телефон</label>
                    <input type="text" id="login-contact" placeholder="111@gmail.com">
                </div>
                <div>
                    <label for="login-password">Пароль</label>
                    <input type="password" id="login-password" placeholder="пароль">
                </div>
                <button type="button" class="btn-primary">Вход</button>
            </fieldset>
        </section>
    </header>

    <main>
        <fieldset>
            <section class="controls-section">
                <h2>Фильтры и сортировка</h2>
                
                <div class="custom-controls">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="filter-instock">
                        <span class="checkmark"></span>
                        Только в наличии
                    </label>
                    
                    <div class="radio-group">
                        <label class="custom-radio">
                            <input type="radio" name="view-mode" value="table" checked>
                            <span class="radiomark"></span>
                            Таблица
                        </label>
                        <label class="custom-radio">
                            <input type="radio" name="view-mode" value="cards">
                            <span class="radiomark"></span>
                            Карточки
                        </label>
                    </div>
                </div>

                <div class="controls">
                    <div class="input-group">
                        <label for="search-input">Поиск</label>
                        <input type="search" id="search-input" placeholder="Поиск…">
                    </div>
                    
                    <div class="input-group">
                        <label for="category-filter">Категория</label>
                        <select id="category-filter">
                            <option value="">Все</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="min-price">Цена от</label>
                        <input type="number" id="min-price" placeholder="0">
                    </div>
                    
                    <div class="input-group">
                        <label for="max-price">Цена до</label>
                        <input type="number" id="max-price" placeholder="50000">
                    </div>

                    <button type="button" id="sort-price-btn" class="btn-secondary">Сортировать по цене</button>
                    <button type="button" id="sort-rating-btn" class="btn-secondary">По рейтингу</button>
                    <button type="button" id="sort-date-btn" class="btn-secondary">По дате</button>
                    
                    <button type="button" id="reset-btn" class="btn-secondary">Сбросить</button>
                </div>
            </section>
        </fieldset>

        <fieldset>
            <section>
                <table id="main-table">
                    <caption>Каталог расходов</caption>
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Заголовок</th>
                            <th scope="col">Категория</th>
                            <th scope="col">Статус</th>
                            <th scope="col">Факт. расходы</th>
                            <th scope="col">Дата</th>
                            <th scope="col">Рейтинг</th>
                        </tr>
                    </thead>
                    <tbody id="expenses-tbody"></tbody>
                </table>
            </section>
        </fieldset>

        <fieldset>
            <section id="stats-container"></section>
        </fieldset>
    </main>

    <footer>
        <p>&copy; 2026 год, бюджет/расходы</p>
    </footer>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-window" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-header">
                <h2 id="modal-title">Детали</h2>
                <button class="modal-close" id="modal-close" aria-label="Закрыть">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer">
                <button class="btn-secondary" id="modal-ok">Понятно</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="render.js"></script>
    <script src="app.js"></script>
</body>
</html>
