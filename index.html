<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бюджеты проектов</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Перейти к основному контенту</a>

  <header class="topbar">
    <div class="topbar__brand">
      <span class="logo">₽</span>
      <h1>BudgetFlow</h1>
    </div>
    
    <nav class="topbar__nav" aria-label="Основная навигация">
      <a href="#" aria-current="page">Проекты</a>
      <a href="#">Статьи расходов</a>
      <a href="#">Утверждение</a>
    </nav>
    
    <div class="topbar__actions">
      <button id="theme-toggle" class="btn btn--ghost" aria-label="Переключить тему">
        Сменить тему
      </button>
      <button type="button" class="btn btn--primary" onclick="document.getElementById('deal-form').scrollIntoView({behavior:'smooth'})">+ Новый расход</button>
    </div>
  </header>

  <main id="main-content" class="main">
    <div class="page-header">
      <h2>Управление бюджетами</h2>
      <p class="page-subtitle">План/факт, статьи расходов и утверждение</p>
    </div>

    <section data-tabs class="tabs-section">
      <div role="tablist" aria-label="Разделы данных" class="tablist">
        <button role="tab" aria-selected="true" aria-controls="panel-deals" id="tab-deals">Проекты (Карточки)</button>
        <button role="tab" aria-selected="false" aria-controls="panel-table" id="tab-table" tabindex="-1">Статьи расходов (Таблица)</button>
      </div>
      <div role="tabpanel" id="panel-deals" aria-labelledby="tab-deals">
        <div id="app-list" class="cards-grid"></div>
      </div>
      <div role="tabpanel" id="panel-table" aria-labelledby="tab-table" hidden>
        <div id="app-table" class="table-wrapper"></div>
      </div>
    </section>

    <section class="form-section">
      <h3>Добавить статью расхода</h3>
      <form id="deal-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="deal-title">Название расхода</label>
            <input id="deal-title" name="title" type="text" data-rule="title" aria-describedby="deal-title-error" aria-invalid="false">
            <p class="field-error" id="deal-title-error" role="alert"></p>
          </div>
          <div class="form-group">
            <label for="deal-amount">Сумма (₽)</label>
            <input id="deal-amount" name="amount" type="number" data-rule="amount" aria-describedby="deal-amount-error" aria-invalid="false">
            <p class="field-error" id="deal-amount-error" role="alert"></p>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn--primary">Отправить на утверждение</button>
        </div>
      </form>
    </section>
  </main>

  <section class="modal" id="deal-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true" hidden>
    <div class="modal__backdrop"></div>
    <article class="modal__window">
      <header class="modal__header">
        <h2 id="modal-title">Детали</h2>
        <button class="modal__close btn btn--icon" type="button" aria-label="Закрыть окно">✕</button>
      </header>
      <div class="modal__body"></div>
      <footer class="modal__footer">
        <button type="button" class="btn btn--ghost modal__close">Отмена</button>
        <button type="button" class="btn btn--primary modal__close">Согласовать</button>
      </footer>
    </article>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
